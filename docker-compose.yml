services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: happiness_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: happiness_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 6

  init-kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: happiness_init_kafka
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo 'Waiting for Kafka broker...'
      cub kafka-ready -b kafka:29092 1 30

      echo 'Creating Kafka topic: happiness-events (3 partitions, replication factor 1)...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic happiness-events \
        --partitions 3 \
        --replication-factor 1

      echo 'Listing topic details:'
      kafka-topics --bootstrap-server kafka:29092 --describe --topic happiness-events
      "

  postgres:
    image: postgres:16-alpine
    container_name: happiness_postgres
    restart: unless-stopped
    ports:
      - "6432:5432"
    environment:
      POSTGRES_DB: happiness_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d happiness_db"]
      interval: 5s
      timeout: 5s
      retries: 5
